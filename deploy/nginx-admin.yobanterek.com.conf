# ── Yobante Admin — site nginx pour le VPS Contabo ─────────────────────
# À copier sur le serveur : /etc/nginx/sites-available/yobante-admin
# puis : ln -s /etc/nginx/sites-available/yobante-admin /etc/nginx/sites-enabled/
# et : nginx -t && systemctl reload nginx
# (Le certificat SSL s'obtient après coup avec certbot : certbot --nginx -d admin.yobanterek.com)

server {
    listen 80;
    listen [::]:80;
    server_name admin.yobanterek.com;

    root /var/www/yobante-admin;
    index index.html;

    # Assure la propriété des fichiers déposés par le workflow (utilisateur root)
    # chown -R www-data:www-data /var/www/yobante-admin

    # Fallback SPA — react-router gère les routes côté client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets hashés (immutables) → cache navigateur long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pas de cache sur index.html (toujours recharger la dernière version)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
