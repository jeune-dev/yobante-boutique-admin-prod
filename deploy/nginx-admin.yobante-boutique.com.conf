# ── Yobante Admin — site nginx pour le VPS Contabo ─────────────────────
# À copier sur le serveur :
#   /etc/nginx/sites-available/yobante-admin-boutique
#   /etc/nginx/snippets/yobante-admin-security.conf  ← nginx-security-headers.conf
# puis : ln -s /etc/nginx/sites-available/yobante-admin-boutique /etc/nginx/sites-enabled/
# et : nginx -t && systemctl reload nginx
#
# ORDRE D'INSTALLATION IMPORTANT
# Ce fichier référence les certificats Let's Encrypt. Si le certificat n'existe
# pas encore, `nginx -t` échoue et nginx refuse de démarrer. Au premier
# déploiement :
#   1. installer d'abord un bloc HTTP seul (ou garder l'ancien) ;
#   2. certbot --nginx -d admin.yobante-boutique.com ;
#   3. puis installer ce fichier et recharger.

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────
# Le dashboard transporte des identifiants d'administration et des jetons JWT :
# il ne doit jamais être servi en clair. Sans cette redirection, un accès à
# http://admin… reste en HTTP et les identifiants partent en clair sur le
# réseau (et HSTS n'est jamais reçu, donc ne protège pas la première visite).
server {
    listen 80;
    listen [::]:80;
    server_name admin.yobante-boutique.com;

    # Renouvellement automatique certbot — doit rester accessible en HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.yobante-boutique.com;

    root /var/www/yobante-admin-boutique;
    index index.html;

    # Assure la propriété des fichiers déposés par le workflow (utilisateur root)
    # chown -R www-data:www-data /var/www/yobante-admin-boutique

    # ── Certificats Let's Encrypt (générés par Certbot) ──────────────────
    ssl_certificate     /etc/letsencrypt/live/admin.yobante-boutique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yobante-boutique.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── TLS durci (aligné sur la configuration de l'API) ─────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── En-têtes de sécurité ─────────────────────────────────────────────
    # `include` et non `add_header` directement : voir le commentaire du
    # snippet. Il DOIT être répété dans chaque `location` qui pose son propre
    # `add_header`, sinon nginx y supprime tous les en-têtes hérités.
    include /etc/nginx/snippets/yobante-admin-security.conf;

    # Masque la version de nginx dans les réponses et pages d'erreur.
    server_tokens off;

    # Fallback SPA — react-router gère les routes côté client
    location / {
        include /etc/nginx/snippets/yobante-admin-security.conf;
        try_files $uri $uri/ /index.html;
    }

    # Assets hashés (immutables) → cache navigateur long
    location /assets/ {
        include /etc/nginx/snippets/yobante-admin-security.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pas de cache sur index.html (toujours recharger la dernière version)
    location = /index.html {
        include /etc/nginx/snippets/yobante-admin-security.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Les fichiers d'environnement ou de sauvegarde déposés par erreur dans
    # la racine web ne doivent jamais être servis.
    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ── Logs ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/yobante-admin-access.log combined;
    error_log  /var/log/nginx/yobante-admin-error.log warn;
}
