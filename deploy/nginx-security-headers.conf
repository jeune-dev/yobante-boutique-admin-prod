# ── En-têtes de sécurité — Yobante Admin ───────────────────────────────────
# À copier sur le serveur : /etc/nginx/snippets/yobante-admin-security.conf
#
# Pourquoi un fichier séparé : dans nginx, un `add_header` présent dans un
# bloc `location` ANNULE tous les `add_header` héritées du bloc `server`.
# Les locations qui posent leur propre `Cache-Control` (/assets/, index.html)
# perdraient donc silencieusement la CSP et HSTS. Centraliser ici et
# `include` dans chaque bloc évite cet oubli à la prochaine modification.

# HSTS — 2 ans, sous-domaines inclus. À n'activer qu'une fois HTTPS confirmé
# fonctionnel (une erreur de certificat devient bloquante pour 2 ans).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Le dashboard ne doit jamais être encadré (clickjacking / UI redressing).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Réduit la surface d'API navigateur accessible depuis le dashboard.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# ── Content-Security-Policy ────────────────────────────────────────────────
# Contrôle compensatoire principal : les jetons d'administration vivent dans
# le localStorage, donc toute exécution de script tiers équivaut à une prise
# de contrôle du compte. La CSP est la barrière qui rend cela difficile.
#
# Choix assumés, vérifiés contre le code de l'application :
#  - script-src 'self' : le bundle Vite est servi depuis cette origine, aucun
#    CDN, aucun script inline dans index.html. Pas de 'unsafe-inline' ici —
#    c'est la directive qui protège réellement contre le XSS.
#  - style-src 'unsafe-inline' : nécessaire et non contournable sans
#    réécriture — l'application utilise massivement l'attribut `style={{…}}`
#    de React et SweetAlert2 injecte ses styles à l'exécution.
#  - connect-src : l'origine de l'API boutique. À ajuster si
#    VITE_SHOP_API_URL change de domaine, sinon
#    toutes les requêtes du dashboard seront bloquées par le navigateur.
#  - frame-ancestors 'none' : double de X-Frame-Options, seule version
#    normalisée et respectée par les navigateurs récents.
#  - object-src / base-uri : ferment les vecteurs <object> et <base href>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.yobante-boutique.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
